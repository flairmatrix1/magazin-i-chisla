<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Магазин и числа</title>
<meta name="description" content="Китайский: числа 0-999, этажи, цены на слух и слова для магазина.">
<meta name="theme-color" content="#3545C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%233545C8%22/%3E%3Ctext x=%2232%22 y=%2245%22 font-size=%2236%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22%3E%E5%AF%B9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=Noto+Sans:wght@500;600&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style id="app-style">
/* Layout: one column of tappable panels for menus; the game is a full-height grid of open cards that never moves */
:root{
  --bg:#EDF0F7; --surface:#FFFFFF; --ink:#1B2140; --muted:#5F6684; --line:#D5DAE8;
  --accent:#3545C8; --accent-ink:#FFFFFF; --accent-soft:#E2E6FF;
  --ok:#1F9D6B; --ok-soft:#D9F3E8; --bad:#D93A3A; --bad-soft:#FCE1E1;
  --shadow:0 1px 2px rgba(27,33,64,.08),0 4px 14px rgba(27,33,64,.06);
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hanzi:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-pinyin:"Noto Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131F; --surface:#1A1F33; --ink:#EEF0FA; --muted:#9AA1BE; --line:#2C3350;
  --accent:#8C98FF; --accent-ink:#0E1230; --accent-soft:#262E5C;
  --ok:#3CCB90; --ok-soft:#143A2C; --bad:#FF6B6B; --bad-soft:#47191C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131F; --surface:#1A1F33; --ink:#EEF0FA; --muted:#9AA1BE; --line:#2C3350;
  --accent:#8C98FF; --accent-ink:#0E1230; --accent-soft:#262E5C;
  --ok:#3CCB90; --ok-soft:#143A2C; --bad:#FF6B6B; --bad-soft:#47191C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{min-height:100%;}
#app.full{height:100%}
#app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
.hz{font-family:var(--f-hanzi);font-weight:500}
.py{font-family:var(--f-pinyin);font-weight:500}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:15px}
.seal{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-hanzi);font-weight:700;font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:58px;font-size:18px;border-radius:16px;width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero h1{font-size:clamp(26px,6vw,40px);line-height:1.1}
.hero p{margin:8px 0 0;color:var(--muted);max-width:40ch}
.fan{position:relative;width:132px;height:100px;flex:none}
.fan span{position:absolute;width:62px;height:76px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center}
.fan span:nth-child(1){left:0;top:16px;transform:rotate(-9deg);font-size:30px}
.fan span:nth-child(2){left:36px;top:2px;font-size:17px;z-index:1;border-color:var(--accent);background:var(--accent-soft)}
.fan span:nth-child(3){left:72px;top:16px;transform:rotate(9deg);font-size:30px}
@media (max-width:420px){.fan{display:none}.hero{grid-template-columns:1fr}}
.group{display:flex;flex-direction:column;gap:10px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.choices{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);min-height:64px}
.choice b{font-weight:600;font-size:16px}
.choice small{color:var(--muted);font-size:13px;line-height:1.3}
.choice[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.note{font-size:14px;color:var(--muted);margin:0}
.warn{padding:12px 14px;border-radius:12px;background:var(--bad-soft);color:var(--ink);font-size:14px}
.cta{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
/* game */
.game{height:100%;display:flex;flex-direction:column;gap:12px;max-width:1100px;margin:0 auto;padding-block:12px}
.hud{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--muted)}
.stat.score b.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.2)}}
.hud .grow{flex:1}
@media (max-width:480px){.hud{gap:8px 12px;flex-wrap:nowrap}.hud .btn{padding-inline:10px;font-size:14px}.stat b{font-size:17px}.stat small{font-size:11px}}
.board{flex:1;min-height:0;display:grid;gap:10px}
.card{position:relative;container-type:size;min-width:0;min-height:0;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;padding:6px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .12s,border-color .12s,background-color .12s,opacity .3s}
.card .face{max-width:100%;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.card .hz{font-size:min(42cqh,calc(84cqw / var(--len,1)))}
.card .py{font-size:min(20cqh,calc(150cqw / var(--len,1)),34px)}
.card .emo{font-size:min(56cqh,56cqw);line-height:1}
.num{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
.num small{font-family:var(--f-body);font-weight:600;font-size:.34em;margin-top:.2em;color:var(--muted)}
.card .num{font-size:min(40cqh,calc(110cqw / var(--nlen,3)))}
.thumb .num{font-size:18px}
/* урок */
.acts-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);min-height:84px}
.act b{font-size:17px;font-weight:600}
.act small{color:var(--muted);font-size:13px;line-height:1.35}
.act .tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.soundrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.soundrow .note{flex:1 1 220px}
.quiz{max-width:720px;margin:0 auto;padding-block:12px 32px;display:flex;flex-direction:column;gap:16px}
.qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-height:190px;justify-content:center}
.qcard .ask{font-size:17px;font-weight:600}
.qcard .ask .hz{font-size:22px}
.qcard .big{font-family:var(--f-display);font-size:clamp(56px,16vw,96px);font-weight:600;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.qcard .reveal{font-size:15px;color:var(--muted)}
.qcard .reveal .hz{font-size:26px;color:var(--ink)}
.qtools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:76px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;padding:8px;touch-action:manipulation;transition:background-color .12s,border-color .12s}
.opt.hz{font-size:min(28px,7vw);font-weight:500}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);opacity:.6}
.card img{position:absolute;top:8px;left:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain;border-radius:12px;pointer-events:none}
.card.sel{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}
.card.ok{border-color:var(--ok);background:var(--ok-soft)}
.card.done{opacity:.4;box-shadow:none;cursor:default}
.card.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.card .tick{position:absolute;top:6px;right:8px;color:var(--ok);font-weight:700;font-size:16px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.card,.card.bad,.stat.score b.pop{animation:none;transition:none}}
/* end */
.result{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result div{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.result b{display:block;font-family:var(--f-display);font-size:34px;font-variant-numeric:tabular-nums}
.result small{color:var(--muted)}
.list{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .t{display:flex;flex-direction:column;min-width:0;flex:1}
.row .t .hz{font-size:20px}
.row .t span{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.btn.play{min-height:40px;width:44px;padding:0;font-size:14px;flex:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.thumb{width:52px;height:52px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;overflow:hidden;font-size:28px}
.thumb img{width:100%;height:100%;object-fit:contain}
.check{width:26px;height:26px;flex:none;accent-color:var(--accent)}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row .acts .btn{min-height:38px;padding:6px 10px;font-size:14px}
@media (max-width:520px){.row{flex-wrap:wrap}.row .acts{width:100%}}
/* form */
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.field input[type=text]{min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:17px;width:100%}
.field input.hz{font-size:22px}
.field small{color:var(--muted);font-size:13px}
.imgpick{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.imgpick .thumb{width:72px;height:72px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.formacts{display:flex;gap:8px;flex-wrap:wrap}
.autoline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:22px;font-size:13px;color:var(--muted)}
.autoline:empty{display:none}
.autoline.busy::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.autoline .btn{min-height:34px;padding:4px 10px;font-size:13px}
.thumb .emo{font-size:40px;line-height:1}
.sharebar{position:sticky;bottom:0;z-index:5;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.sharebar .panel{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:var(--shadow);border-color:var(--accent)}
/* modal & toast */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,12,25,.45);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal .panel{width:min(520px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.linkbox{display:flex;gap:8px;flex-wrap:wrap}
.linkbox input{flex:1 1 220px;min-width:0;min-height:44px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:15px;max-width:min(520px,calc(100% - 32px));box-shadow:var(--shadow)}
.homework{display:flex;flex-direction:column;gap:18px;padding-block:8vh 24px}
.homework .eyebrow{color:var(--accent);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.homework h1{font-size:clamp(28px,7vw,44px);line-height:1.1}
</style>
</head>

/* ---------- Пиньинь: цифры в тоны (kan4 -> kàn) ---------- */
var TONES = {a:'āáǎà', e:'ēéěè', i:'īíǐì', o:'ōóǒò', u:'ūúǔù', 'ü':'ǖǘǚǜ'};
function markSyl(s, t){
  s = s.replace(/u:/g,'ü').replace(/U:/g,'Ü').replace(/v/g,'ü').replace(/V/g,'Ü');
  if (t < 1 || t > 4) return s;
  var low = s.toLowerCase(), idx = -1;
  if (low.indexOf('a') >= 0) idx = low.indexOf('a');
  else if (low.indexOf('e') >= 0) idx = low.indexOf('e');
  else if (low.indexOf('ou') >= 0) idx = low.indexOf('o');
  else { for (var i = low.length-1; i >= 0; i--) { if ('aeiouü'.indexOf(low[i]) >= 0) { idx = i; break; } } }
  if (idx < 0) return s;
  var m = TONES[low[idx]][t-1];
  return s.slice(0, idx) + (s[idx] !== low[idx] ? m.toUpperCase() : m) + s.slice(idx+1);
}
function numToMarks(str){ return String(str).replace(/([A-Za-züÜvV:]+)([1-5])/g, function(_, s, t){ return markSyl(s, +t); }); }

/* ---------- Числа по-китайски ---------- */
var DIG = '零一二三四五六七八九';

  if (n < 10) return {hz:DIG[n], py:DPY[n]};
  var t = Math.floor(n/10), o = n % 10, hz = '', sy = [];
  if (t > 1) { hz += DIG[t]; sy.push(DPY[t]); }
  hz += '十'; sy.push('shí');
  if (o) { hz += DIG[o]; sy.push(DPY[o]); }

}
/* liang: 两 вместо 二 перед счётным словом (两块, 两百块) */
function numInfo(n, liang){
  if (n < 100) return (liang && n === 2) ? {hz:'两', py:'liǎng'} : under100(n);
  var h = Math.floor(n/100), r = n % 100;
  var hz1 = (liang && h === 2 ? '两' : DIG[h]) + '百';
  var py1 = (liang && h === 2 ? 'liǎng' : (h === 1 ? 'yì' : DPY[h])) + 'bǎi';
  if (r === 0) return {hz:hz1, py:py1};
  if (r < 10) return {hz:hz1 + '零' + DIG[r], py:py1 + ' líng ' + DPY[r]};
  var t = Math.floor(r/10), o = r % 10, sy = [t === 1 ? 'yī' : DPY[t], 'shí'];
  if (o) sy.push(DPY[o]);
  return {hz:hz1 + DIG[t] + '十' + (o ? DIG[o] : ''), py:py1 + ' ' + joinSyl(sy)};
}
/* порядок изучения чисел: 0-10, 11-19, десятки, остальные до 99, сотни, трёхзначные */
var NUM_ORDER = (function(){
  var out = [], i, seedv = 7;
  function rnd(){ seedv = (seedv * 9301 + 49297) % 233280; return seedv / 233280; }
  for (i = 0; i <= 19; i++) out.push(i);
  for (i = 20; i <= 90; i += 10) out.push(i);
  var rest = []; for (i = 21; i <= 99; i++) if (i % 10) rest.push(i);
  rest.sort(function(){ return rnd() - .5; }); out = out.concat(rest);
  for (i = 100; i <= 900; i += 100) out.push(i);
  var big = {}; while (Object.keys(big).length < 60) { var v = 101 + Math.floor(rnd() * 898); if (v % 100) big[v] = 1; }
  return out.concat(Object.keys(big).map(Number));
})();
var NUMS = NUM_ORDER.map(function(n){ var x = numInfo(n); return {id:'n:'+n, hz:x.hz, py:x.py, ru:String(n), num:String(n)}; });
var FLOORS = []; for (var fl = 1; fl <= 30; fl++) { var fx = under100(fl); FLOORS.push({id:'f:'+fl, hz:fx.hz+'楼', py:fx.py+' lóu', ru:fl+' этаж', num:String(fl), unit:'этаж'}); }
var SHOP = [
  ['多少钱','duōshao qián','сколько стоит','🏷️'], ['钱','qián','деньги','💰'], ['块','kuài','юань (разг.)',''],
  ['这个','zhège','вот это','👇'], ['那个','nàge','вон то','👉'], ['几个','jǐ ge','сколько штук',''],
  ['要','yào','хочу, нужно',''], ['不要','bú yào','не хочу, не надо','🙅'], ['付钱','fù qián','оплатить','💳'],
  ['美女','měinǚ','девушка! (обращение)','👩'], ['什么','shénme','что','❓'], ['好','hǎo','хорошо','👌'],
  ['等一下','děng yíxià','подождите','✋'], ['楼','lóu','этаж','🏢'], ['住','zhù','жить','🏠'],
  ['你住几楼','nǐ zhù jǐ lóu','на каком этаже ты живёшь',''],

/* ---------- Наборы слов ---------- */
function poolFor(source){
  if (source === 'shared') return SHARED_SET ? SHARED_SET.words : [];
  var arr = [];
  if (HSK_PARTS[source]) arr = HSK_PARTS[source];
  else if (POOLS[source]) arr = POOLS[source];
  else {
    if (source === 'mine' || source === 'both') arr = arr.concat(st.words);
    if (source !== 'mine') arr = arr.concat(HSK);
  }
  var seen = {};
  return arr.filter(function(w){ if (!w.hz || !w.py || seen[w.hz]) return false; seen[w.hz] = 1; return true; });
}
var PAIR_KINDS = {'py-img':['py','img'], 'hz-img':['hz','img'], 'py-hz':['py','hz']};
var PAIR_NAMES = {'py-img':'пиньинь + картинка', 'hz-img':'иероглифы + картинка', 'py-hz':'пиньинь + иероглифы'};
function typeFor(w, mode){
  if (mode !== 'auto') return mode;
  if (!hasImg(w)) return 'py-hz';
  var p = st.progress[w.id];
  if (!p || (p.clean||0) < 2) return 'py-img';
  return (p.alt||0) % 2 === 0 ? 'hz-img' : 'py-hz';

/* ---------- Озвучка (голос браузера, без интернета) ---------- */
var SOUND = load('sound', true);
var zhVoice = null;
var zhVoices = [];
function pickVoice(){
  if (!window.speechSynthesis) return;
  var vs = window.speechSynthesis.getVoices() || [];
  var odd = /Grandma|Grandpa|Rocko|Shelley|Sandy|Reed|Eddy|Flo/i;
  var cn = vs.filter(function(v){ return /^zh[-_]CN/i.test(v.lang) || /^cmn/i.test(v.lang); });
  if (!cn.length) cn = vs.filter(function(v){ return /^zh/i.test(v.lang) && !/HK|yue/i.test(v.lang); });
  /* голос с самого устройства надёжнее: интернет-голоса Google в Chrome часто молчат (VPN, сеть) */
  function score(v){ return (v.localService ? 0 : 10) + (/Tingting|Ting-Ting|Li-mu|Yu-shu|Meijia|Xiaoxiao|Yunxi|Huihui|Kangkang|Yaoyao/i.test(v.name) ? 0 : 2) + (odd.test(v.name) ? 3 : 0); }
  zhVoices = cn.slice().sort(function(a, b){ return score(a) - score(b); });
  zhVoice = zhVoices[0] || null;
}
if (window.speechSynthesis) { pickVoice(); try { window.speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch(e){ window.speechSynthesis.onvoiceschanged = pickVoice; } }
var lastUtter = null; /* держим ссылку, иначе браузер может «потерять» фразу и замолчать */
function say(text, force){
  if ((!SOUND && !force) || !window.speechSynthesis || !text) return;
  if (!zhVoices.length) pickVoice();
  sayWith(text, zhVoice, 0);
}
function sayWith(text, voice, tries){
  var synth = window.speechSynthesis;
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; if (voice) u.voice = voice; u.rate = 0.85; u._try = tries;
    u.onend = function(){ if (lastUtter === u) lastUtter = null; };
    u.onerror = function(e){
      if (lastUtter === u) lastUtter = null;
      var why = e && e.error;
      if (why === 'interrupted' || why === 'canceled' || (u._try || 0) >= 2) return;
      /* голос не сработал: пробуем следующий китайский, потом голос по умолчанию */
      var next = zhVoices[zhVoices.indexOf(u.voice) + 1] || null;
      sayWith(text, u.voice ? next : null, (u._try || 0) + 1);
    };
    u.onstart = function(){ u._started = true; };
    /* голос молчит и не сообщает об ошибке: через 1,5 с пробуем другой */
    setTimeout(function(){
      if (u._started || lastUtter !== u || tries >= 2) return;
      try { synth.cancel(); } catch(e){}
      lastUtter = null;
      var next = zhVoices[zhVoices.indexOf(u.voice) + 1] || null;
      sayWith(text, u.voice ? next : null, tries + 1);
    }, 1500);
    var prev = lastUtter;
    lastUtter = u; u._t = Date.now();
    if (synth.paused) synth.resume();
    if (prev && (synth.speaking || synth.pending)) {
      /* сразу после cancel браузеры часто молчат: даём паузу */
      synth.cancel();
      setTimeout(function(){ if (lastUtter === u) { synth.resume(); synth.speak(u); } }, 80);
    } else {
      synth.speak(u);
    }
  } catch(e){}
}
/* если голос «завис», сбрасываем очередь, чтобы следующие слова снова звучали */
setInterval(function(){
  var synth = window.speechSynthesis; if (!synth) return;
  if (lastUtter && Date.now() - lastUtter._t > 8000) lastUtter = null;
  if (!lastUtter && (synth.speaking || synth.pending)) synth.cancel();
}, 4000);
/* iPhone и iPad дают говорить только после касания: «будим» голос беззвучной фразой */

/* ---------- Раунд ---------- */
var round = null;
var lessonSource = null; /* какой набор урока сейчас играется */
function currentSource(){ return lessonSource || (sharedId ? 'shared' : st.settings.source); }
function currentMode(){ return (lessonSource || sharedId) ? 'auto' : st.settings.mode; }
function eligible(){
  var mode = currentMode();
  var pool = poolFor(currentSource());
  if (mode === 'py-img' || mode === 'hz-img') pool = pool.filter(hasImg);
  return pool;
}
/* Новые слова появляются, только когда текущие выучены.
   Выучено = собрано без ошибок MASTER раундов подряд. */
var MASTER = 2;
var NEW_PER_ROUND = 2;
function prog(w){ return st.progress[w.id] || null; }
function isSeen(w){ var p = prog(w); return !!p && (p.seen||0) > 0; }
function isMastered(w){ var p = prog(w); return !!p && (p.streak||0) >= MASTER; }
function countMastered(list){ return list.filter(isMastered).length; }
function buildRound(){
  var mode = currentMode();
  var pool = eligible();
  var rnd = {}; pool.forEach(function(w){ rnd[w.id] = Math.random(); });
  var byLast = function(a, b){ var pa = prog(a), pb = prog(b); return ((pa && pa.last) || 0) - ((pb && pb.last) || 0) || rnd[a.id] - rnd[b.id]; };
  var learning = pool.filter(function(w){ return isSeen(w) && !isMastered(w); }).sort(byLast);
  var fresh = pool.filter(function(w){ return !isSeen(w); });
  var known = pool.filter(isMastered).sort(byLast);
  var newLimit = pool.some(isSeen) ? NEW_PER_ROUND : PAIRS;
  var used = {}, items = [];
  function tryAdd(w, isNew){
    if (items.length >= PAIRS) return false;
    var keys = ['id:'+w.id, 'py:'+normPy(w.py), 'hz:'+w.hz]; if (w.emoji) keys.push('em:'+w.emoji); if (w.num) keys.push('num:'+w.num+(w.unit||''));
    if (keys.some(function(k){ return used[k]; })) return false;
    keys.forEach(function(k){ used[k] = 1; });
    items.push({w:w, type:typeFor(w, mode), auto: mode === 'auto', isNew: !!isNew});
    return true;
  }
  /* 1) то, что ещё учим; 2) немного новых; 3) повтор выученного; 4) если места осталось, ещё новые */
  learning.forEach(function(w){ tryAdd(w); });
  var added = 0;
  fresh.forEach(function(w){ if (added < newLimit && tryAdd(w, true)) added++; });
  known.forEach(function(w){ tryAdd(w); });
  fresh.forEach(function(w){ tryAdd(w, true); });
  var cards = [];
  items.forEach(function(it){ PAIR_KINDS[it.type].forEach(function(k){ cards.push({wid:it.w.id, kind:k, w:it.w}); }); });
  shuffle(cards);
  return {items:items, cards:cards, score:0, errors:0, found:0, erred:{}, sel:-1, badTimer:null, bad:[], done:false};
}

function startGame(){
  var pool = eligible();
  if (!pool.length) { renderStart(true); return; }
  round = buildRound();
  renderGame();
}

function cardHtml(c, i){
  var w = c.w, inner, label;
  if (c.kind === 'hz') { inner = '<span class="face hz" style="--len:'+Math.max(1, Array.from(w.hz).length)+'">'+esc(w.hz)+'</span>'; label = w.hz; }

function renderGame(){
  screen = 'game'; app.classList.add('full');
  var total = round.items.length;
  app.innerHTML = '<div class="game">'+
    '<div class="hud">'+
      '<button class="btn" id="g-menu">Меню</button>'+soundBtn()+

      '<div class="stat"><b id="g-err">0</b><small>ошибки</small></div>'+
      '<div class="stat score"><b id="g-score">0</b><small>очки</small></div>'+
    '</div>'+
    '<div class="board" id="board">'+round.cards.map(cardHtml).join('')+'</div>'+
  '</div>';
  document.getElementById('g-menu').onclick = function(){ clearBad(); round = null; route(); };
  var sb = document.getElementById('g-sound');
  if (sb) sb.onclick = function(){ SOUND = !SOUND; save('sound', SOUND); sb.setAttribute('aria-pressed', SOUND ? 'true' : 'false'); sb.textContent = SOUND ? '🔊 Звук' : '🔇 Без звука'; if (!SOUND && window.speechSynthesis) window.speechSynthesis.cancel(); };

function fitBoard(){
  var board = document.getElementById('board'); if (!board || !round) return;
  var n = round.cards.length, gap = 10;
  var W = board.clientWidth, H = board.clientHeight;
  if (!W || !H) return;
  var best = null;
  for (var cols = 1; cols <= n; cols++) {
    var rows = Math.ceil(n / cols);
    var cw = (W - gap*(cols-1)) / cols, ch = (H - gap*(rows-1)) / rows;
    if (cw <= 0 || ch <= 0) continue;
    var ratio = cw / ch;
    var score = Math.min(cw, ch * 1.3) - (rows*cols - n) * 6 - (ratio > 2 ? 40 : 0);
    if (!best || score > best.score) best = {cols:cols, rows:rows, score:score};
  }
  if (best) { board.style.gridTemplateColumns = 'repeat('+best.cols+',minmax(0,1fr))'; board.style.gridTemplateRows = 'repeat('+best.rows+',minmax(0,1fr))'; }
}
window.addEventListener('resize', fitBoard);

function cardEl(i){ return document.querySelector('.card[data-i="'+i+'"]'); }

  round.bad.forEach(function(i){ var el = cardEl(i); if (el) el.classList.remove('bad'); });
  round.bad = [];
}
function setScore(){
  var s = document.getElementById('g-score'); s.textContent = round.score;
  s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop');
  document.getElementById('g-err').textContent = round.errors;
  document.getElementById('g-found').textContent = round.found + ' из ' + round.items.length;

function tap(i){
  if (!round || round.done) return;

  clearBad();
  var el = cardEl(i);
  if (round.sel === -1) { round.sel = i; el.classList.add('sel'); el.setAttribute('aria-pressed','true'); return; }
  if (round.sel === i) { round.sel = -1; el.classList.remove('sel'); el.setAttribute('aria-pressed','false'); return; }
  var j = round.sel, other = round.cards[j], oel = cardEl(j);
  round.sel = -1;
  oel.classList.remove('sel'); oel.setAttribute('aria-pressed','false');
  if (other.wid === c.wid) {
    c.matched = other.matched = true;
    round.score += 10; round.found++;
    say(c.w.hz);
    [el, oel].forEach(function(x){ x.classList.add('ok'); x.disabled = true; x.insertAdjacentHTML('beforeend','<span class="tick" aria-hidden="true">✓</span>'); setTimeout(function(){ x.classList.add('done'); }, 450); });
    setScore();

function finishRound(){
  st.counter++; save('counter', st.counter);
  round.items.forEach(function(it){
    var p = st.progress[it.w.id] || {clean:0, seen:0, alt:0, streak:0};
    var before = p.clean || 0, wasMastered = (p.streak||0) >= MASTER;
    if (!round.erred[it.w.id]) { p.clean = before + 1; p.streak = (p.streak||0) + 1; }
    else p.streak = 0;
    p.seen = (p.seen||0) + 1; p.last = st.counter;
    if (it.auto && before >= 2 && it.type !== 'py-img') p.alt = (p.alt||0) + 1;
    it.levelUp = it.auto && hasImg(it.w) && before < 2 && (p.clean||0) >= 2;
    it.justMastered = !wasMastered && p.streak >= MASTER;
    st.progress[it.w.id] = p;
  });
  save('progress', st.progress);
  renderEnd();
}

    return '<div class="row"><div class="thumb">'+(hasImg(w) ? picHtml(w) : '<span class="hz" style="font-size:20px">'+esc(Array.from(w.hz)[0])+'</span>')+'</div>'+

function readImage(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){
      var max = 360, w = im.naturalWidth, h = im.naturalHeight;
      if (!w || !h) { URL.revokeObjectURL(url); rej(new Error('size')); return; }
      var k = Math.min(1, max / Math.max(w, h)); w = Math.round(w*k); h = Math.round(h*k);
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var x = c.getContext('2d'); x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try { res(c.toDataURL('image/jpeg', 0.82)); } catch(e){ rej(e); }
    };
    im.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('load')); };
    im.src = url;
  });
}

function makePinyin(hz){
  var known = KNOWN[hz]; if (known) return known.py;
  var P = window.pinyinPro; if (!P || !P.pinyin) return '';
  var parts = [];
  hz.split(/[\s,，。.!！?？、]+/).filter(Boolean).forEach(function(chunk){
    var toks;
    try { toks = P.segment(chunk).map(function(t){ return {hz:t.origin, py:t.result}; }); }
    catch(e){ toks = Array.from(chunk).map(function(c, k){ return {hz:c, py:P.pinyin(chunk, {type:'array'})[k] || ''}; }); }
    /* склеиваем соседние иероглифы, если вместе это известное слово */
    var out = [];
    toks.forEach(function(t){
      var last = out[out.length - 1];
      if (last && LEX[last.hz + t.hz] && Array.from(last.hz + t.hz).length <= 4) { last.hz += t.hz; last.py += t.py; }
      else out.push({hz:t.hz, py:t.py});
    });
    out.forEach(function(t){ parts.push(t.py); });
  });

  var raw = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream) return streamBytes(raw, new CompressionStream('deflate-raw')).then(function(b){ return 'z' + b64u(b); });
  return Promise.resolve('j' + b64u(raw));
}
function unpackSet(str){
  var kind = str.charAt(0), bytes = unb64u(str.slice(1));
  var p = kind === 'z' ? streamBytes(bytes, new DecompressionStream('deflate-raw')) : Promise.resolve(bytes);
  return p.then(function(b){ return JSON.parse(new TextDecoder().decode(b)); });
}
function smallImage(url){
  /* для ссылки картинку уменьшаем, чтобы ссылка осталась короткой */
  if (!url || /^data:image\/svg/.test(url)) return Promise.resolve(url || '');
  return new Promise(function(res){
    var im = new Image();
    im.onload = function(){
      var max = 140, w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      w = Math.round(w*k); h = Math.round(h*k);
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var x = c.getContext('2d'); x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
      try { res(c.toDataURL('image/jpeg', 0.62)); } catch(e){ res(url); }
    };
    im.onerror = function(){ res(url); };
    im.src = url;
  });
}
function wordForLink(w){
  var b = BUILTIN[w.id];
  if (b && b.hz === w.hz && b.py === w.py && b.ru === w.ru && (b.img || '') === (w.img || '')) return Promise.resolve(w.id.slice(2));
  return smallImage(w.img).then(function(img){ return [w.id.slice(2), w.hz, w.py, w.ru || '', img || '', w.emoji || '']; });
}
function wordFromLink(x){
  if (typeof x === 'string') return BUILTIN['m:' + x] || null;
  if (!Array.isArray(x) || !x[1] || !x[2]) return null;
  return {id:'m:' + x[0], hz:x[1], py:x[2], ru:x[3] || '', img:x[4] || '', emoji:x[5] || ''};
}

}

var toastTimer = null;
function toast(msg){
  var t = document.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg;
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.remove(); }, 3600);
}

/* ---------- Задания с вариантами ответа ---------- */
var quiz = null;
var QUIZ_LEN = 10;
function rndInt(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function pickNum(kind){
  var r = Math.random();
  if (kind === 'floor') return rndInt(1, 33);
  if (kind === 'price') return r < .4 ? rndInt(1, 20) : r < .75 ? rndInt(21, 99) : rndInt(100, 999);
  return r < .3 ? rndInt(0, 20) : r < .6 ? rndInt(21, 99) : rndInt(100, 999);
}
/* похожие числа: 3 / 13 / 30 / 300, перестановка цифр, соседние */
function distractors(n, min, max){
  var s = String(n), c = [];
  c.push(n < 10 ? n * 10 : null, n < 10 ? 10 + n : null, (n >= 11 && n <= 19) ? (n % 10) * 10 : null, (n >= 20 && n < 100 && n % 10 === 0) ? 10 + n / 10 : null);
  if (s.length > 1) c.push(Number(s.split('').reverse().join('')));
  c.push(n * 10, Math.floor(n / 10), n < 100 ? n * 100 : null);
  for (var i = 0; i < s.length; i++) { var d = +s[i]; [d + 1, d - 1].forEach(function(x){ if (x >= 0 && x <= 9 && !(i === 0 && x === 0 && s.length > 1)) c.push(Number(s.slice(0, i) + x + s.slice(i + 1))); }); }
  c.push(n + 10, n - 10, n + 1, n - 1);
  var seen = {}, list = []; seen[n] = 1;
  c.forEach(function(x){ if (x != null && !isNaN(x) && x >= min && x <= max && !seen[x]) { seen[x] = 1; list.push(x); } });
  var top = shuffle(list.slice(0, 5)), out = top.slice(0, 2);
  var rest = shuffle(list.slice(2).filter(function(x){ return out.indexOf(x) < 0; }));
  while (out.length < 3 && rest.length) out.push(rest.shift());
  while (out.length < 3) { var v = rndInt(min, max); if (!seen[v] && out.indexOf(v) < 0) out.push(v); }
  return out;
}
function makeQuestion(kind){
  var q = {kind:kind};
  if (kind === 'listen-num' || kind === 'read-num') {
    var n = pickNum(), x = numInfo(n);
    q.answer = n; q.opts = shuffle([n].concat(distractors(n, 0, 999)));
    q.speech = x.hz; q.reveal = '<span class="hz">'+x.hz+'</span><br><span class="py">'+x.py+'</span>';
    if (kind === 'listen-num') { q.ask = 'Какое число прозвучало?'; q.label = function(v){ return String(v); }; q.listen = true; }
    else { q.ask = 'Как это число пишется иероглифами?'; q.big = String(n); q.label = function(v){ return numInfo(v).hz; }; q.hzOpts = true; }
  } else if (kind === 'listen-price') {
    var p = pickNum('price'), px = numInfo(p, true), pre = Math.random() < .35, qian = Math.random() < .65;
    q.answer = p; q.opts = shuffle([p].concat(distractors(p, 1, 999)));
    q.speech = (pre ? '这个' : '') + px.hz + '块' + (qian ? '钱' : '');
    q.reveal = '<span class="hz">'+q.speech+'</span><br><span class="py">'+(pre ? 'zhège ' : '')+px.py+' kuài'+(qian ? ' qián' : '')+'</span>';
    q.ask = 'Продавец называет цену. Сколько это стоит?'; q.label = function(v){ return '¥' + v; }; q.listen = true;
  } else {
    var f = pickNum('floor'), fx = under100(f);
    q.answer = f; q.opts = shuffle([f].concat(distractors(f, 1, 40)));
    q.speech = '我住' + fx.hz + '楼';
    q.reveal = '<span class="hz">'+q.speech+'</span><br><span class="py">wǒ zhù '+fx.py+' lóu</span>';
    q.ask = '<span class="hz">你住几楼？</span><br>На каком этаже она живёт?'; q.label = function(v){ return v + ' этаж'; }; q.listen = true;
  }
  return q;
}
function startQuiz(item){
  quiz = {item:item, n:0, score:0, errors:0, clean:0};
  nextQuestion();
}
function nextQuestion(){
  if (quiz.n >= QUIZ_LEN) { renderQuizEnd(); return; }
  quiz.q = makeQuestion(quiz.item.q); quiz.q.erred = false; quiz.q.done = false; quiz.n++;
  renderQuiz();
  if (quiz.q.listen) say(quiz.q.speech, true);
}
function renderQuiz(){
  screen = 'quiz'; app.classList.remove('full');
  var q = quiz.q;
  app.innerHTML = '<div class="quiz">'+
    '<div class="hud"><button class="btn" id="q-back">К уроку</button><div class="grow"></div>'+
      '<div class="stat"><b>'+quiz.n+' из '+QUIZ_LEN+'</b><small>вопрос</small></div>'+
      '<div class="stat"><b id="q-err">'+quiz.errors+'</b><small>ошибки</small></div>'+
      '<div class="stat score"><b id="q-score">'+quiz.score+'</b><small>очки</small></div></div>'+
    '<div class="qcard"><div class="ask">'+q.ask+'</div>'+
      (q.big ? '<div class="big">'+esc(q.big)+'</div>' : '')+
      (q.listen ? '<div class="qtools"><button class="btn primary" id="q-play">🔊 Ещё раз</button><button class="btn" id="q-show">Показать текст</button></div>' : '')+
      '<div class="reveal" id="q-reveal" hidden>'+q.reveal+'</div></div>'+
    '<div class="opts">'+q.opts.map(function(v){ return '<button class="opt'+(q.hzOpts ? ' hz' : '')+'" data-v="'+v+'">'+esc(q.label(v))+'</button>'; }).join('')+'</div>'+
  '</div>';
  document.getElementById('q-back').onclick = function(){ quiz = null; route(); };
  var pl = document.getElementById('q-play'); if (pl) pl.onclick = function(){ say(q.speech, true); };
  var sh = document.getElementById('q-show'); if (sh) sh.onclick = function(){ document.getElementById('q-reveal').hidden = false; sh.remove(); };
  app.querySelectorAll('.opt').forEach(function(b){ b.onclick = function(){ answerQuiz(b); }; });
}
function answerQuiz(b){
  var q = quiz.q; if (q.done || b.classList.contains('bad')) return;
  if (+b.dataset.v === q.answer) {
    q.done = true; b.classList.add('ok'); quiz.score += 10; if (!q.erred) quiz.clean++;
    document.getElementById('q-reveal').hidden = false;
    var sh = document.getElementById('q-show'); if (sh) sh.remove();
    say(q.speech);
    document.getElementById('q-score').textContent = quiz.score;
    setTimeout(function(){ if (quiz && quiz.q === q) nextQuestion(); }, q.listen ? 1600 : 1300);
  } else {
    b.classList.add('bad'); q.erred = true; quiz.score -= 2; quiz.errors++;
    document.getElementById('q-score').textContent = quiz.score;
    document.getElementById('q-err').textContent = quiz.errors;
  }
}
function renderQuizEnd(){
  screen = 'quiz-end';
  app.innerHTML = '<div class="wrap"><h1>'+esc(quiz.item.title)+': готово</h1>'+
    '<div class="result"><div><b>'+quiz.score+'</b><small>очки</small></div><div><b>'+quiz.clean+' из '+QUIZ_LEN+'</b><small>с первой попытки</small></div></div>'+
    '<div class="cta"><button class="btn primary big" id="q-again">Ещё 10 вопросов</button></div>'+
    '<button class="btn ghost" id="q-menu">К уроку</button></div>';
  document.getElementById('q-again').onclick = function(){ startQuiz(quiz.item); };
  document.getElementById('q-menu').onclick = function(){ quiz = null; route(); };
}

/* ---------- Навигация ---------- */
function readHash(){ var m = /^#hw=([zj][A-Za-z0-9_-]+)$/.exec(location.hash || ''); return m ? m[1] : null; }
function route(){
  lessonSource = null;
  var les = readLesson() || 'shop'; /* эта игра всегда открывает урок */
  if (les) { sharedId = null; SHARED_SET = null; lessonId = les; renderLesson(); return; }
  lessonId = null;
  var payload = readHash();
  if (!payload) { sharedId = null; SHARED_SET = null; renderStart(false); return; }
  sharedId = 'link';
  unpackSet(payload).then(function(obj){
    var words = (obj && Array.isArray(obj.w) ? obj.w : []).map(wordFromLink).filter(Boolean);
    SHARED_SET = words.length ? {title: String(obj.t || 'Домашнее задание'), words: words} : null;
    renderShared();
  }).catch(function(){ SHARED_SET = null; renderShared(); });
}
window.addEventListener('hashchange', function(){ if (screen !== 'editor' && screen !== 'game' && screen !== 'quiz') { round = null; quiz = null; route(); } });
if (window.ResizeObserver) { new ResizeObserver(function(){ if (screen === 'game') fitBoard(); }).observe(app); }
route();
})();
